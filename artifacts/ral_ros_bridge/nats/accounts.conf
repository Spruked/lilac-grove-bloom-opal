# Illustrative nats-server authorization fragment.
# Generate real nkeys; do not ship seeds in git.

accounts: {
  LLM: {
    users: [ { nkey: "U_LLM_PUBLIC" } ]
    export: []
    limits: { payload: 65536 }
  }
  PLANNER: {
    users: [ { nkey: "U_PLANNER_PUBLIC" } ]
  }
  TRIBUNAL: {
    users: [ { nkey: "U_TRIBUNAL_PUBLIC" } ]
  }
  BRIDGE: {
    users: [ { nkey: "U_BRIDGE_PUBLIC" } ]
  }
  TOOL_WORKERS: {
    users: [ { nkey: "U_TOOLS_PUBLIC" } ]
  }
}

# Resolved permissions (also documented in permissions.md):
# LLM:      pub ral.*.cycle.*.proposal
#           sub ral.*.ws.changed, ral.*.tel.health
# PLANNER:  pub ral.*.cycle.*.proposal, ral.*.cmd.>
#           sub ral.*.cycle.*.verdict, ral.*.tel.>, ral.*.ws.changed
# TRIBUNAL: pub ral.*.cycle.*.verdict
#           sub ral.*.cycle.*.proposal, ral.*.tribunal.evaluate
# BRIDGE:   pub ral.*.tel.>, $JS.API.KV.WS.>
#           sub ral.*.cmd.motion.>, ral.*.cmd.estop
# TOOLS:    pub ral.*.tel.tool
#           sub queue tool-workers on ral.*.cmd.tool.*
